name: Labeler

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run Labeler
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          skip-delete: true
          dry-run: ${{ github.event_name == 'pull_request' }}
