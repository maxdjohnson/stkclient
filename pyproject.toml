[project]
name = "stkclient"
version = "0.2.0"
description = "Send To Kindle"
authors = [{name = "Max Johnson", email = "maxdjohnson@gmail.com"}]
license = "MIT"
license-files = ["LICENSE.rst"]
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dynamic = ["classifiers"]
dependencies = [
    "defusedxml>=0.7.1,<0.8.0",
    "rsa>=4.9.1,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/maxdjohnson/stkclient"
Repository = "https://github.com/maxdjohnson/stkclient"
Documentation = "https://stkclient.readthedocs.io"
Changelog = "https://github.com/maxdjohnson/stkclient/releases"

[project.scripts]
stkclient = "stkclient.__main__:main"

[tool.poetry]
classifiers = [
    "Development Status :: 4 - Beta",
]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
coverage = {extras = ["toml"], version = "^7.16.2"}
pytest-mock = "^3.16"
httpretty = "^1.1.4"

# Run maintenance tools on Python 3.12 independently of the package's runtime floor.
[tool.poetry.group.dev.dependencies]
pip-audit = {version = "^2.10.1", python = ">=3.12"}
mypy = {version = "^2.4", python = ">=3.12"}
typeguard = {version = "^4.6", python = ">=3.12"}
xdoctest = {extras = ["colors"], version = "^1.3.2", python = ">=3.12"}
sphinx = {version = "^9.1", python = ">=3.12"}
sphinx-autobuild = {version = "^2025.8.25", python = ">=3.12"}
pre-commit = {version = "^4.6.2", python = ">=3.12"}
ruff = {version = "^0.16.10", python = ">=3.12"}
pre-commit-hooks = {version = "^6.0", python = ">=3.12"}
furo = {version = "^2025.12.19", python = ">=3.12"}
sphinx-argparse = {version = "^0.6.1", python = ">=3.12"}

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["stkclient", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
strict = true
warn_unreachable = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C90", "D", "E", "F", "I", "N", "S", "UP", "W", "RUF100", "RUF102"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
