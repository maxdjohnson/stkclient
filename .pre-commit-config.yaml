repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --only-group lint ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --only-group lint ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: check-added-large-files
        name: Check for added large files
        entry: uv run --locked --only-group lint check-added-large-files
        language: system
      - id: check-toml
        name: Check Toml
        entry: uv run --locked --only-group lint check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check Yaml
        entry: uv run --locked --only-group lint check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: Fix End of Files
        entry: uv run --locked --only-group lint end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: uv run --locked --only-group lint trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: prettier
        name: Prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: [prettier@3.9.10]
        types_or: [yaml, json, markdown]
