version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install uv==0.13.0
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --group docs --no-editable
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
formats: all
